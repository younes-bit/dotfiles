[window]
dimensions = { columns = 100, lines = 30 }
decorations = "full"
opacity = 0.88
#title = 
startup_mode = "Windowed"
dynamic_padding = true
padding = { x = 6, y = 6 }

[font]
size = 13.0
builtin_box_drawing = true

[font.normal]
#need to install it
family = "Iosevka Nerd Font"
style = "Regular"

[font.bold]
family = "Iosevka Nerd Font"
style = "Bold"

[font.italic]
family = "Iosevka Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Iosevka Nerd Font"
style = "Bold Italic"


[font.offset]
x = 0
y = 1

[font.glyph_offset]
x = 0
y = 0


[keyboard]
bindings = [
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "N", mods = "Control|Shift", action = "SpawnNewInstance" },
]


[colors.primary]
background = "#0f111a"
foreground = "#d9e0ee"

[colors.normal]
black   = "#1e1e2e"
red     = "#f38ba8"
green   = "#abe9b3"
yellow  = "#f9e2af"
blue    = "#96cdfb"
magenta = "#f5c2e7"
cyan    = "#89dceb"
white   = "#cdd6f4"

# [colors.bright]
# black   = "#575268"
# red     = "#f38ba8"
# green   = "#abe9b3"
# yellow  = "#f9e2af"
# blue    = "#96cdfb"
# magenta = "#f5c2e7"
# cyan    = "#89dceb"
# white   = "#cdd6f4"

[colors.bright]
black   = "#6e6f88"
red     = "#ff5c93"
green   = "#b8f0a0"
yellow  = "#ffe066"
blue    = "#a1cfff"
magenta = "#ff9de5"
cyan    = "#96fdfd"
white   = "#ffffff"

[colors.cursor]
text = "#1e1e2e"
cursor = "#96cdfb"

[colors.selection]
text = "#1e1e2e"
background = "#f5c2e7"

[cursor]
style = { shape = "Beam", blinking = "On" }
thickness = 0.2

[scrolling]
history = 50000
multiplier = 3

